<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="main">
            <div class="header">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input class="input-num" 
                    type="text">
                <button id="convert-btn">Convert</button>
            </div>
            <div class="info">
                <div class="info-card">
                    <p>Length (Meter/Feet)</p>
                    <p class="main-info" id="length"></p>
                </div>
                <div class="info-card">
                    <p>Volume (Liters/Gallons)</p>
                    <p class="main-info" id="volume"></p>
                </div>
                <div class="info-card">
                    <p>Mass (Kilograms/Pounds)</p>
                    <p class="main-info" id="mass"></p>
                </div>
            </div>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
